name: Deploy to InterServer VPS

# Corre sempre que há um push para main. Liga-se por SSH à VPS e corre
# o script scripts/deploy-interserver.sh, que faz git pull + rebuild dos
# containers Docker afectados + verificação de saúde.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            cd /opt/StreamServer
            ./scripts/deploy-interserver.sh
