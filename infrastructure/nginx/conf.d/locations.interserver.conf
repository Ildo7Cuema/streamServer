# =============================================================================
# Nginx locations — InterServer (frontend + API + stream no mesmo host)
# =============================================================================
# /api e dashboard usam proxy_pass com variável (resolver Docker).
# /stream/ usa o upstream estático icecast_server (ver nginx.interserver.conf)
# COM barra final, para o Nginx cortar o prefixo /stream/.
# =============================================================================

# Barra final em proxy_pass: /stream/radio-chipindo/live → Icecast /radio-chipindo/live
location /stream/ {
    proxy_pass http://icecast_server/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Icy-MetaData $http_icy_metadata;
    proxy_pass_header Icy-MetaData;
    proxy_pass_header Ice-Audio-Info;
    proxy_pass_header Content-Type;
    limit_conn stream_conn 10;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers "Origin, Accept, X-Requested-With, Content-Type, Icy-MetaData" always;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

location /api/ {
    limit_req zone=api burst=50 nodelay;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}

# Assets estáticos do Dashboard
location ^~ /assets/ {
    proxy_pass http://$dashboard_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /api/auth/login {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /ws {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
}

location /health {
    proxy_pass http://$backend_upstream/api/health;
    access_log off;
}

location /player {
    alias /usr/share/nginx/html/player;
    index index.html;
    try_files $uri $uri/ /player/index.html;
}

# Favicon e ícones
location = /favicon.png {
    proxy_pass http://$dashboard_upstream/favicon.png;
    proxy_set_header Host $host;
}

location = /apple-touch-icon.png {
    proxy_pass http://$dashboard_upstream/apple-touch-icon.png;
    proxy_set_header Host $host;
}

# Dashboard (SPA) na raiz — relative /api funciona sem VITE_BACKEND_URL
location / {
    proxy_pass http://$dashboard_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
