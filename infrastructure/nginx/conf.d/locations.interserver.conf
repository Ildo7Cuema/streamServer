# =============================================================================
# Nginx locations — InterServer (frontend + API + stream no mesmo host)
# =============================================================================

location /stream/ {
    proxy_pass http://icecast_server/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Icy-MetaData $http_icy_metadata;
    proxy_pass_header Icy-MetaData;
    proxy_pass_header Ice-Audio-Info;
    proxy_pass_header Content-Type;
    limit_conn stream_conn 10;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers "Origin, Accept, X-Requested-With, Content-Type, Icy-MetaData" always;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

location /api/ {
    limit_req zone=api burst=50 nodelay;
    proxy_pass http://backend_api/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}

location /api/auth/login {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://backend_api/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /ws {
    proxy_pass http://backend_api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
}

location /health {
    proxy_pass http://backend_api/api/health;
    access_log off;
}

location /player {
    alias /usr/share/nginx/html/player;
    index index.html;
    try_files $uri $uri/ /player/index.html;
}

# Dashboard (SPA) na raiz — relative /api funciona sem VITE_BACKEND_URL
location / {
    proxy_pass http://dashboard_app/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
