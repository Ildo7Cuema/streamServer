# Nginx — stack completo InterServer (dashboard + API + stream)
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 500M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=stream_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # DNS interno do Docker — resolve os upstreams pedido a pedido em vez de
    # uma única vez no arranque. Se um container ainda não estiver pronto
    # quando o Nginx arranca, este continua a subir (evita
    # "host not found in upstream" a matar o Nginx inteiro); os pedidos só
    # falham individualmente até o serviço em causa ficar disponível.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        set $backend_upstream backend:3000;
        set $icecast_upstream icecast:8000;
        set $dashboard_upstream dashboard:80;

        include /etc/nginx/conf.d/locations.interserver.conf;
    }
}
